  - slug: finding-colors
    title: Finding Colors
    tags: Picture book
    more: Flip through the book
    pieces:
      - label: "Cover"
        src: /assets/images/picture-book/finding-colors/p-01.jpg
        thumb: /assets/images/picture-book/finding-colors/thumbs/p-01.jpg
        width: 800
