bio:
- I enjoy working on stories with horror aspects and eerie atmospheres. I love storytelling
  as well as creating visuals to convey my stories to a greater audience. My work focuses
  on character animation, visual effects, and compositing.
- In my free time, I enjoy watching movies and anime, as well as all sorts of media from novels
  to superhero comic books. I also enjoy gaming and writing wild stories based on my imagination.
- I have been intrigued by animation since I was little, with Pixar movies and anime. The
  possibility of bringing my imagination and characters to life with animation struck me.
  The idea of making only a few panels of my heroes punching villains into a full movie-like
  action sequence sounded brilliant. It was then that I became determined to learn animation
  and make my characters move like they are action movie stars.
- I hope to contribute to projects that inspire others the way superheroes and animated worlds
  inspired me—to remind people of the power of imagination and the joy of seeing them come
  to life.
