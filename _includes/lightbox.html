<div class="lightbox" id="lightbox" tabindex="-1" role="dialog" aria-modal="true" aria-label="Media viewer" aria-hidden="true">
  <button class="lightbox-btn lightbox-close" type="button" aria-label="Close">
    {% include icons/close.svg %}
  </button>
  <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous">
    {% include icons/chevron-left.svg %}
  </button>
  <video class="lightbox-media" controls loop playsinline hidden></video>
  <img class="lightbox-media" alt="" hidden>
  <button class="lightbox-btn lightbox-next" type="button" aria-label="Next">
    {% include icons/chevron-right.svg %}
  </button>
  <div class="lightbox-caption"></div>
</div>
