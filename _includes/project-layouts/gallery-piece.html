{% assign item = include.item %}
<figure class="gallery-piece">
  <div class="gallery-frame" data-lightbox="paint"
    data-src="{{ item.src }}" data-type="image" data-title="{{ item.title }}" data-meta="{{ item.meta }}">
    <img src="{{ item.thumb | default: item.src }}" alt="{{ item.alt | default: item.title }}" loading="lazy">
  </div>
  <figcaption class="gallery-label">
    <span class="gallery-title">{{ item.title }}</span>
    <span class="gallery-meta">Andrew Yen · {{ item.meta }}</span>
  </figcaption>
</figure>
