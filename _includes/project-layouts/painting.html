{% assign items = include.section.items %}
<section class="container gallery-3d reveal" data-gallery-room>
  <div class="gallery-room">
    <div class="room-floor" aria-hidden="true"></div>
    <div class="room-track" role="group" aria-roledescription="carousel" aria-label="Gallery">
      {% for item in items %}
        {% assign num = forloop.index | prepend: '0' | slice: -2, 2 %}
        <figure class="room-slide{% if forloop.first %} is-active{% endif %}" data-index="{{ forloop.index0 }}"
          aria-label="{{ forloop.index }} of {{ items.size }}">
          <div class="room-hang">
            <span class="room-light" aria-hidden="true"></span>
            <div class="room-frame" data-lightbox="paint-room"
              data-src="{{ item.src }}" data-type="image" data-title="{{ item.title }}" data-meta="{{ item.meta }}">
              <img src="{{ item.thumb | default: item.src }}" alt="{{ item.alt | default: item.title }}">
            </div>
            <div class="museum-card">
              <span class="museum-artist">Andrew Yen</span>
              <span class="museum-title">{{ item.title }}</span>
              <span class="museum-medium">{{ item.meta }}</span>
              <span class="museum-num">{{ num }} / {{ items.size | prepend: '0' | slice: -2, 2 }}</span>
            </div>
          </div>
        </figure>
      {% endfor %}
    </div>
    <div class="room-arrows">
      <span class="room-ring" aria-hidden="true"></span>
      <button type="button" class="room-arrow room-arrow--prev" data-room-prev aria-label="Previous painting">
        <svg viewBox="0 0 48 40" aria-hidden="true"><path d="M30 3 6 20l24 17 9-6-15-11 15-11z" /></svg>
      </button>
      <button type="button" class="room-arrow room-arrow--next" data-room-next aria-label="Next painting">
        <svg viewBox="0 0 48 40" aria-hidden="true"><path d="M18 3l24 17-24 17-9-6 15-11L9 9z" /></svg>
      </button>
    </div>
  </div>
</section>

<section class="container gallery-pins">
  <div class="section-head">
    <h2 class="section-title">All works</h2>
    <span class="section-count">{{ items.size }} {{ include.section.unit }}</span>
  </div>
  <div class="pin-board">
    {% for item in items %}
      <figure class="pin reveal">
        <div class="pin-frame" data-lightbox="paint"
          data-src="{{ item.src }}" data-type="image" data-title="{{ item.title }}" data-meta="{{ item.meta }}">
          <img src="{{ item.thumb | default: item.src }}" alt="{{ item.alt | default: item.title }}" loading="lazy">
        </div>
        <figcaption class="museum-card museum-card--small">
          <span class="museum-title">{{ item.title }}</span>
          <span class="museum-medium">Andrew Yen · {{ item.meta }}</span>
        </figcaption>
      </figure>
    {% endfor %}
  </div>
</section>
